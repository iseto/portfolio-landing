name: Portfolio regression checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 1"
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Summarize accessibility and regression evidence
        if: always()
        run: node scripts/audit-summary.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-report
          path: |
            playwright-report/
            test-results/
            reports/
          retention-days: 90
