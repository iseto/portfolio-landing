name: Daily portfolio link health
on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  external-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-links.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: link-health
          path: reports/links.json
          retention-days: 30
